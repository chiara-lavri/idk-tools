<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List to Details</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 640px;
    margin: 1.5em auto;
    padding: 0 1em;
    line-height: 1.5;
  }
  label {
    display: block;
    font-weight: bold;
    margin-top: 1em;
    margin-bottom: 0.3em;
  }
  input[type="text"], textarea, select {
    width: 100%;
    box-sizing: border-box;
    font-size: 1em;
    padding: 0.5em;
  }
  input[type="number"] {
    box-sizing: border-box;
    width: 6em;
    font-size: 1em;
    padding: 0.4em;
    margin-left: 0.5em;
  }
  textarea {
    resize: vertical;
  }
  select option {
    padding-left: 0;
    text-indent: 0;
  }
  fieldset {
    border: 0;
    margin: 1em 0 0 0;
    padding: 0;
  }
  legend {
    font-weight: bold;
    padding: 0;
    margin-bottom: 0.3em;
  }
  .check {
    margin: 0.4em 0;
  }
  .check label {
    display: inline;
    font-weight: normal;
    margin: 0;
  }
  .check input[type="checkbox"] {
    width: 1.1em;
    height: 1.1em;
    margin: 0 0.5em 0 0;
    vertical-align: middle;
  }
  button {
    margin-top: 1em;
    margin-right: 0.5em;
    padding: 0.6em 1.2em;
    font-size: 1em;
  }
  #output {
    margin-top: 1.5em;
    padding: 1em;
    border: 1px solid #999;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 0.9em;
  }
  #status {
    margin-top: 0.5em;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>List to Details</h1>

<label for="labelBox">Summary label</label>
<input type="text" id="labelBox" value="Details">

<label for="listBox">List (comma-separated, or one item per line)</label>
<textarea id="listBox" rows="8" placeholder="item one, item two, item three"></textarea>

<label for="typeBox">List type</label>
<select id="typeBox">
  <option value="ul" selected>Bulleted: no type attribute</option>
  <option value="ul:disc">Bulleted: disc (solid circle)</option>
  <option value="ul:circle">Bulleted: circle (hollow circle)</option>
  <option value="ul:square">Bulleted: square</option>
  <option value="ol">Ordered: no type attribute</option>
  <option value="ol:1">Ordered: 1 (1, 2, 3)</option>
  <option value="ol:a">Ordered: a (a, b, c)</option>
  <option value="ol:A">Ordered: A (A, B, C)</option>
  <option value="ol:i">Ordered: i (i, ii, iii)</option>
  <option value="ol:I">Ordered: I (I, II, III)</option>
</select>

<fieldset>
  <legend>Other attributes</legend>
  <div class="check">
    <input type="checkbox" id="openBox">
    <label for="openBox">open: start with the details expanded</label>
  </div>
  <div class="check">
    <input type="checkbox" id="reversedBox">
    <label for="reversedBox">reversed: count down (ordered lists only, including letters and Roman numerals)</label>
  </div>
  <div class="check">
    <input type="checkbox" id="compactBox">
    <label for="compactBox">compact: tighter spacing (old attribute, bulleted or ordered)</label>
  </div>
  <div class="check">
    <label for="startBox">start: first number, whole number (ordered lists only; 3 gives c in a lettered list)</label>
    <input type="number" id="startBox" step="1">
  </div>
</fieldset>

<button id="convertBtn" type="button">Convert</button>
<button id="copyBtn" type="button">Copy result</button>

<div id="status" role="status" aria-live="polite"></div>

<label for="output">Result (HTML)</label>
<div id="output" tabindex="0"></div>

<script>
(function(){
  var labelBox = document.getElementById('labelBox');
  var typeBox = document.getElementById('typeBox');
  var openBox = document.getElementById('openBox');
  var reversedBox = document.getElementById('reversedBox');
  var compactBox = document.getElementById('compactBox');
  var startBox = document.getElementById('startBox');
  var listBox = document.getElementById('listBox');
  var output = document.getElementById('output');
  var status = document.getElementById('status');
  var convertBtn = document.getElementById('convertBtn');
  var copyBtn = document.getElementById('copyBtn');
  var lastResult = '';

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function clean(s) {
    return s.trim();
  }

  function notEmpty(s) {
    return s.length > 0;
  }

  // More than one non-empty line means one item per line.
  // Otherwise the text is treated as a comma-separated list.
  function parseItems(text) {
    var lines = text.split(/\r?\n/).map(clean).filter(notEmpty);
    if (lines.length > 1) {
      return { items: lines, mode: 'new lines' };
    }
    var items = (lines[0] || '').split(',').map(clean).filter(notEmpty);
    return { items: items, mode: 'commas' };
  }

  function convert() {
    var parsed = parseItems(listBox.value);
    var items = parsed.items;

    var label = labelBox.value.trim() || 'Details';

    var typeParts = typeBox.value.split(':');
    var tag = typeParts[0];
    var typeAttr = typeParts[1] || '';
    var isOl = (tag === 'ol');

    if (items.length === 0) {
      status.textContent = 'Nothing to convert yet. Paste a list first, either comma-separated or one item per line.';
      output.textContent = '';
      lastResult = '';
      return;
    }

    var skipped = [];
    var listAttrs = '';

    if (typeAttr) {
      listAttrs += ' type="' + typeAttr + '"';
    }

    var startText = startBox.value.trim();
    if (startText !== '') {
      if (!isOl) {
        skipped.push('start (ordered lists only)');
      } else if (/^-?\d+$/.test(startText)) {
        listAttrs += ' start="' + parseInt(startText, 10) + '"';
      } else {
        skipped.push('start (needs a whole number)');
      }
    }

    if (reversedBox.checked) {
      if (isOl) {
        listAttrs += ' reversed';
      } else {
        skipped.push('reversed (ordered lists only)');
      }
    }

    if (compactBox.checked) {
      listAttrs += ' compact';
    }

    var lines = [];
    lines.push(openBox.checked ? '<details open>' : '<details>');
    lines.push('<summary>' + escapeHtml(label) + '</summary>');
    lines.push('<' + tag + listAttrs + '>');
    items.forEach(function(item){
      lines.push('<li>' + escapeHtml(item) + '</li>');
    });
    lines.push('</' + tag + '>');
    lines.push('</details>');

    lastResult = lines.join('\n');
    output.textContent = lastResult;

    var message = 'Converted ' + items.length + ' item(s), split on ' + parsed.mode + '.';
    if (skipped.length > 0) {
      message += ' Left out: ' + skipped.join(', ') + '.';
    }
    message += ' Tap Copy result to copy it.';
    status.textContent = message;
  }

  function copyResult() {
    if (!lastResult) {
      status.textContent = 'Nothing to copy yet — convert a list first.';
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastResult).then(function(){
        status.textContent = 'Copied to clipboard.';
      }).catch(function(){
        fallbackCopy();
      });
    } else {
      fallbackCopy();
    }
  }

  function fallbackCopy() {
    var temp = document.createElement('textarea');
    temp.value = lastResult;
    temp.style.position = 'fixed';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    try {
      document.execCommand('copy');
      status.textContent = 'Copied to clipboard.';
    } catch (e) {
      status.textContent = 'Copy failed — select the result text manually and copy it.';
    }
    document.body.removeChild(temp);
  }

  convertBtn.addEventListener('click', convert);
  copyBtn.addEventListener('click', copyResult);
})();
</script>

</body>
</html>
